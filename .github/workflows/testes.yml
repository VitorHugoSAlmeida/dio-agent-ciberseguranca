name: Testes de seguranca
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  teste-local:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rodar testes
        run: python -m unittest discover -s testes -v
      - name: Executar exemplo corrigido
        run: python -m exemplos.app
